<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Prueba del chat web</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    main { max-width: 640px; margin: 15vh auto; padding: 0 24px; }
    p { color: #475569; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Prueba del chat web</h1>
    <p>Así se ve el chat en un sitio. Escríbele como si fueras un cliente: la conversación llega a Chats como un lead del canal Web.</p>
  </main>
  <script>
    // Página de prueba de Configuración → Canales → Widget web: carga el widget de la empresa de ?c=.
    var c = new URLSearchParams(location.search).get("c");
    if (c) {
      var s = document.createElement("script");
      s.src = "/widget.js";
      s.async = true;
      s.setAttribute("data-company", c);
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
